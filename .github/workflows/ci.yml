name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# No Python, no network and no timing here: the tests use fake workers and fake
# clocks. The one test that runs the real Python worker (uv_test.go) is skipped
# unless REFBENCH_UV is set.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: go version
      - run: gofmt -l .
        shell: bash
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 40
          # go tool cover's total is rounded to one decimal (99.95 reads 100.0);
          # covblocks lists every block the profile never entered (exit 1 if
          # any, exit 2 on an empty or unreadable profile).
          go run github.com/go-fleettools/fleettools/cmd/covblocks@v0.104.0 cover.out

  # int is 32 bits here: v0.1.0 did not compile on 386 and arm.
  arch-386:
    name: arch 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - name: Vet + test (GOARCH=386)
        run: |
          GOARCH=386 go vet ./...
          GOARCH=386 go test ./...
      - name: Compile tests for 32-bit arm
        run: GOARCH=arm CGO_ENABLED=0 go test -c -o /dev/null .

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
